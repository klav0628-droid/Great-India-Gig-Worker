<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gig India — Find Gigs. Earn More.</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f7f9fc;color:#12212f}.wrap{max-width:1180px;margin:auto;padding:0 22px}.nav{height:72px;background:#fff;border-bottom:1px solid #e7edf3;display:flex;align-items:center}.navin{display:flex;align-items:center;justify-content:space-between;width:100%}.logo{font-weight:850;font-size:22px}.actions{display:flex;gap:10px}.btn{border:1px solid #dbe3eb;background:#fff;padding:11px 17px;border-radius:10px;font-weight:750;cursor:pointer}.primary{background:#ff5a1f;color:#fff;border-color:#ff5a1f}.dark{background:#12212f;color:#fff;border-color:#12212f}.hero{padding:60px 0;background:#fff7f2}.hero h1{font-size:52px}.hero span{color:#ff5a1f}.search{display:flex;gap:8px;background:#fff;padding:10px;border-radius:14px;max-width:700px}.search input,.search select{flex:1;padding:13px;border:1px solid #dbe3eb;border-radius:9px}.section{padding:45px 0}.grid,.jobs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.cat,.job,.card{background:#fff;border:1px solid #e7edf3;border-radius:16px;padding:18px}.job h3{margin:12px 0}.modal{position:fixed;inset:0;background:#0b172080;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modalbox{background:#fff;border-radius:20px;padding:28px;max-width:480px;width:100%;max-height:90vh;overflow:auto}.modalbox input,.modalbox select,.modalbox textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dbe3eb;border-radius:10px;margin:7px 0 12px}.close{float:right;border:0;padding:7px}.admin,.workerPanel{display:none;min-height:calc(100vh - 72px);background:#f8fafc}.admin.show,.workerPanel.show{display:block}.top{background:#fff;padding:22px 0;border-bottom:1px solid #e7edf3}.layout{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:25px 0}.side{background:#fff;border:1px solid #e7edf3;border-radius:16px;padding:10px}.side button{width:100%;padding:12px;text-align:left;border:0;background:#fff;border-radius:9px;cursor:pointer;font-weight:700}.side button.active,.side button:hover{background:#fff1ea;color:#d9480f}.panel{display:none}.panel.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.dashCard{background:#fff;border:1px solid #e7edf3;border-radius:15px;padding:18px}.dashCard strong{display:block;font-size:28px;margin-top:8px}.tableWrap{background:#fff;border:1px solid #e7edf3;border-radius:15px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:13px;border-bottom:1px solid #e7edf3;text-align:left}.notice{padding:12px;background:#eff6ff;border-radius:9px;margin:12px 0}.status{padding:5px 8px;border-radius:99px;background:#edf8f2;color:#137a46;font-size:11px;font-weight:800}.status.pending{background:#fff7ed;color:#c2410c}.taskBox{background:#fff;border:1px solid #e7edf3;border-radius:15px;padding:18px;margin-bottom:15px}.footer{padding:35px;text-align:center;background:#0e1822;color:#fff}.hidden{display:none!important}@media(max-width:800px){.grid,.jobs{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.search{flex-direction:column}}
</style></head><body>
<div id="site"><header class="nav"><div class="wrap navin"><div class="logo">🟧 Gig India</div><div class="actions"><button class="btn" onclick="openLogin('worker')">Worker Login</button><button class="btn primary" onclick="openWorkerSignup()">Create Worker Account</button><button class="btn dark" onclick="openLogin('admin')">Admin Login</button></div></div></header>
<main id="home"><section class="hero"><div class="wrap"><h1>Find work. <span>Earn on your terms.</span></h1><p>Discover flexible gigs, field projects, digital work and more.</p><div class="search"><input id="search" placeholder="Search gigs or categories"><select id="cat"><option value="">All categories</option></select><button class="btn dark" onclick="renderHome()">Search</button></div></div></section><section class="section"><div class="wrap"><h2>Explore categories</h2><div id="categories" class="grid"></div></div></section><section class="section"><div class="wrap"><h2>Latest gig opportunities</h2><div id="gigs" class="jobs"></div></div></section></main><footer class="footer">Great India Technology</footer></div>
<div id="admin" class="admin"><div class="top"><div class="wrap"><b style="font-size:24px">Gig India Admin</b><button class="btn" style="float:right" onclick="logout()">Logout</button></div></div><div class="wrap layout"><aside class="side" id="adminNav"></aside><main id="adminContent"></main></div></div>
<div id="worker" class="workerPanel"><div class="top"><div class="wrap"><b id="workerName" style="font-size:22px">Worker</b><button class="btn" style="float:right" onclick="logout()">Logout</button></div></div><div class="wrap layout"><aside class="side" id="workerNav"></aside><main id="workerContent"></main></div></div>
<div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div>
<script>
const URL='https://pkofzvbdeljsksecbqzg.supabase.co';
const KEY='sb_publishable_oAYg9uDeIYVHQ829qTMTaQ_pXvhG2Kb';
const H=()=>({'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'});
let db={workers:[],gigs:[],categories:[],projects:[],applications:[],tasks:[],taskHistory:[],walletHistory:[],withdrawals:[],leads:[],activities:[],projectSubmissions:[],receipts:[],offerLetters:[]};let current={role:null,id:null};
const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){try{let r=await fetch(URL+'/rest/v1/gig_india_state?id=eq.1',{headers:H()});if(!r.ok)throw Error(r.status);let a=await r.json();if(a[0]?.data)db=Object.assign(db,a[0].data)}catch(e){let x=localStorage.getItem('gig_india_state');if(x)db=Object.assign(db,JSON.parse(x))}if(!db.categories.length)db.categories=[{id:'C1',name:'Delivery',icon:'🚚'},{id:'C2',name:'Digital Gigs',icon:'💻'},{id:'C3',name:'Telecalling',icon:'📞'},{id:'C4',name:'Field Survey',icon:'📝'},{id:'C5',name:'Sales & Marketing',icon:'📈'},{id:'C6',name:'Data Entry',icon:'⌨️'}];renderHome()}
async function save(){localStorage.setItem('gig_india_state',JSON.stringify(db));let r=await fetch(URL+'/rest/v1/gig_india_state?on_conflict=id',{method:'POST',headers:{...H(),'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id:1,data:db,updated_at:new Date().toISOString()})});if(!r.ok)console.warn('cloud save',r.status)}
function modal(x){$('modalContent').innerHTML=x;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
function openLogin(role){modal(`<h2>${role==='admin'?'Admin Login':'Worker Login'}</h2><input id="li" placeholder="User ID / Mobile"><input id="lp" type="password" placeholder="Password"><button class="btn primary" style="width:100%" onclick="login('${role}')">Login</button>`)}
function login(role){let id=$('li').value.trim(),p=$('lp').value;if(role==='admin'){if(id==='9006977016'&&p==='Lavk@23456'){current={role:'admin',id:'admin'};closeModal();show('admin');renderAdmin()}else alert('Invalid Admin User ID or Password');return}let w=db.workers.find(x=>String(x.mobile)===id&&String(x.password)===p);if(!w){alert('Invalid Worker Login');return}current={role:'worker',id:w.id};closeModal();show('worker');renderWorker()}
function openWorkerSignup(){modal(`<h2>Create Worker Account</h2><input id="sn" placeholder="Full name"><input id="sm" placeholder="Mobile number"><input id="se" type="email" placeholder="Email"><input id="sp" type="password" placeholder="Password"><input id="sl" placeholder="Location"><input id="ss" placeholder="Skills"><button class="btn primary" style="width:100%" onclick="register()">Create Account</button>`)}
async function register(){let name=$('sn').value.trim(),mobile=$('sm').value.trim(),email=$('se').value.trim(),password=$('sp').value;if(!name||!mobile||!password)return alert('Name, mobile and password required');if(db.workers.some(w=>w.mobile===mobile))return alert('Worker already exists');let w={id:'W'+Date.now(),name,mobile,email,password,location:$('sl').value.trim(),skills:$('ss').value.trim(),wallet:0,post:'Worker',createdAt:new Date().toISOString()};db.workers.push(w);await save();current={role:'worker',id:w.id};closeModal();show('worker');renderWorker()}
function show(role){$('site').style.display=role?'none':'';$('admin').classList.toggle('show',role==='admin');$('worker').classList.toggle('show',role==='worker')}
function logout(){current={role:null,id:null};show(null);renderHome()}
function renderHome(){let q=($('search').value||'').toLowerCase(),c=$('cat');c.innerHTML='<option value="">All categories</option>'+db.categories.map(x=>`<option>${esc(x.name)}</option>`).join('');$('categories').innerHTML=db.categories.map(x=>`<div class="cat"><h3>${esc(x.icon||'💼')} ${esc(x.name)}</h3><p>${db.gigs.filter(g=>g.category===x.name).length} opportunities</p></div>`).join('');let cat=c.value;let gs=db.gigs.filter(g=>(!q||JSON.stringify(g).toLowerCase().includes(q))&&(!cat||g.category===cat));$('gigs').innerHTML=gs.map(g=>`<div class="job"><b>${esc(g.title)}</b><p>${esc(g.company||'')} · ${esc(g.location||'India')}</p><strong>₹${Number(g.payment||0).toLocaleString('en-IN')}</strong><button class="btn primary" style="width:100%;margin-top:12px" onclick="apply('${esc(g.id)}')">Apply Now</button></div>`).join('')||'<div class="card">No gigs found.</div>'}
function apply(id){if(current.role!=='worker')return openLogin('worker');let g=db.gigs.find(x=>x.id===id);modal(`<h2>Apply: ${esc(g.title)}</h2><textarea id="an" placeholder="Why are you suitable?"></textarea><button class="btn primary" onclick="submitApp('${esc(id)}')">Submit Application</button>`)}
async function submitApp(id){let w=db.workers.find(x=>x.id===current.id);db.applications.unshift({id:'A'+Date.now(),gigId:id,workerId:w.id,workerName:w.name,status:'Pending',note:$('an').value,date:new Date().toISOString()});await save();closeModal();renderWorker()}
function renderAdmin(){let n=[['dash','Dashboard'],['gigs','Gigs'],['applications','Applications'],['workers','Workers'],['tasks','Tasks'],['projects','Projects'],['withdrawals','Withdrawals'],['history','Task History']];$('adminNav').innerHTML=n.map((x,i)=>`<button class="${i?'':'active'}" onclick="adminTab('${x[0]}',this)">${x[1]}</button>`).join('');adminTab('dash',$('adminNav').firstChild)}
function adminTab(t,b){document.querySelectorAll('#adminNav button').forEach(x=>x.classList.remove('active'));b?.classList.add('active');let h='';if(t==='dash')h=`<div class="cards"><div class="dashCard">Workers<strong>${db.workers.length}</strong></div><div class="dashCard">Gigs<strong>${db.gigs.length}</strong></div><div class="dashCard">Applications<strong>${db.applications.length}</strong></div><div class="dashCard">Tasks<strong>${db.tasks.length}</strong></div></div>`;if(t==='gigs')h=`<h2>Gigs</h2>${db.gigs.map(g=>`<div class="taskBox"><b>${esc(g.title)}</b><p>${esc(g.company||'')} · ₹${Number(g.payment||0)}</p></div>`).join('')}`;if(t==='applications')h=`<h2>Applications</h2><div class="tableWrap"><table class="table"><tr><th>Worker</th><th>Gig</th><th>Status</th></tr>${db.applications.map(a=>`<tr><td>${esc(a.workerName)}</td><td>${esc(db.gigs.find(g=>g.id===a.gigId)?.title||'')}</td><td>${esc(a.status)}</td></tr>`).join('')}</table></div>`;if(t==='workers')h=`<h2>Workers</h2><div class="tableWrap"><table class="table"><tr><th>Name</th><th>Mobile</th><th>Post</th><th>Wallet</th></tr>${db.workers.map(w=>`<tr><td>${esc(w.name)}</td><td>${esc(w.mobile)}</td><td>${esc(w.post||'Worker')}</td><td>₹${Number(w.wallet||0)}</td></tr>`).join('')}</table></div>`;if(t==='tasks')h=`<h2>Tasks</h2>${db.tasks.map(t=>`<div class="taskBox"><b>${esc(t.title)}</b><p>${esc(t.workerName)} · ₹${Number(t.payment||0)} · ${esc(t.status)}</p></div>`).join('')}`;if(t==='projects')h=`<h2>Projects</h2>${db.projects.map(p=>`<div class="taskBox"><b>${esc(p.title)}</b><p>${esc(p.client||'')}</p></div>`).join('')}`;if(t==='withdrawals')h=`<h2>Withdrawals</h2>${db.withdrawals.map(x=>`<div class="taskBox"><b>${esc(x.workerName)}</b> · ₹${Number(x.amount||0)} · <span class="status">${esc(x.status)}</span></div>`).join('')}`;if(t==='history')h=`<h2>Task History</h2>${db.taskHistory.map(x=>`<div class="taskBox"><b>${esc(x.title)}</b> · ${esc(x.workerName)} · ₹${Number(x.payment||0)}</div>`).join('')}`;$('adminContent').innerHTML=h||'<div class="card">No data.</div>'}
function renderWorker(){let w=db.workers.find(x=>x.id===current.id);$('workerName').textContent=w?.name||'Worker';let n=[['dash','Dashboard'],['gigs','Gig Opportunities'],['applications','My Applications'],['tasks','My Tasks'],['projects','My Projects'],['history','My Task History'],['wallet','Wallet'],['profile','Profile']];$('workerNav').innerHTML=n.map((x,i)=>`<button class="${i?'':'active'}" onclick="workerTab('${x[0]}',this)">${x[1]}</button>`).join('');workerTab('dash',$('workerNav').firstChild)}
function workerTab(t,b){document.querySelectorAll('#workerNav button').forEach(x=>x.classList.remove('active'));b?.classList.add('active');let w=db.workers.find(x=>x.id===current.id),h='';if(t==='dash')h=`<div class="cards"><div class="dashCard">Wallet<strong>₹${Number(w.wallet||0)}</strong></div><div class="dashCard">Applications<strong>${db.applications.filter(x=>x.workerId===w.id).length}</strong></div><div class="dashCard">Tasks<strong>${db.tasks.filter(x=>x.workerId===w.id).length}</strong></div><div class="dashCard">Completed<strong>${db.taskHistory.filter(x=>x.workerId===w.id).length}</strong></div></div>`;if(t==='gigs')h=db.gigs.map(g=>`<div class="taskBox"><b>${esc(g.title)}</b><p>${esc(g.company||'')} · ₹${Number(g.payment||0)}</p><button class="btn primary" onclick="apply('${esc(g.id)}')">Apply Now</button></div>`).join('');if(t==='applications')h=db.applications.filter(x=>x.workerId===w.id).map(a=>`<div class="taskBox"><b>${esc(db.gigs.find(g=>g.id===a.gigId)?.title||'')}</b> · ${esc(a.status)}</div>`).join('');if(t==='tasks')h=db.tasks.filter(x=>x.workerId===w.id).map(x=>`<div class="taskBox"><b>${esc(x.title)}</b><p>₹${Number(x.payment||0)} · ${esc(x.status)}</p></div>`).join('');if(t==='projects')h=db.projects.filter(x=>x.workerId===w.id).map(x=>`<div class="taskBox"><b>${esc(x.title)}</b><p>${esc(x.client||'')}</p></div>`).join('');if(t==='history')h=db.taskHistory.filter(x=>x.workerId===w.id).map(x=>`<div class="taskBox"><b>${esc(x.title)}</b> · ₹${Number(x.payment||0)}</div>`).join('');if(t==='wallet')h=`<div class="card"><h2>Wallet</h2><h1>₹${Number(w.wallet||0).toLocaleString('en-IN')}</h1></div>`;if(t==='profile')h=`<div class="card"><h2>My Profile</h2><p>Name: ${esc(w.name)}</p><p>Mobile: ${esc(w.mobile)}</p><p>Email: ${esc(w.email||'')}</p><p>Post: ${esc(w.post||'Worker')}</p></div>`;$('workerContent').innerHTML=h||'<div class="card">No data.</div>'}
load();
</script></body></html>
