name: Refresh Gig India Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh site build
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<meta name="gig-india-version" content="2026-08-21-login-fix">'
          if marker not in s:
              s=s.replace('<title>Gig India — Find Gigs. Earn More.</title>','<title>Gig India — Find Gigs. Earn More.</title>\n'+marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit refreshed site
        run: |
          git config user.name 'Gig India Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refresh GitHub Pages build'
          git push
