name: Gig India Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gig-india-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Gig India portal runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=['<script src="./login-bridge.js?v=9d8510a"></script>','<script src="./login-fix-final.js"></script>','<script src="./login-direct.js?v=17aa5209"></script>','<script src="./clean-runtime.js"></script>','<script src="./portal-final.js?v=0130fcab"></script>']
          for tag in old: s=s.replace(tag,'')
          inject='<script src="./login-direct.js?v=latest"></script>\n<script src="./data-bridge.js?v=latest"></script>'
          if './login-direct.js?v=latest' not in s: s=s.replace('</body>',inject+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
