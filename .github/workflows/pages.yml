name: Gig India - GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "gig-india-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for name,ver in [('login-fix-final.js','20260821-fix4'),('portal-fix-final.js','20260821-fix4')]:
              import re
              s=re.sub(r'<script[^>]+src=["\']\./'+re.escape(name)+r'[^>]*></script>\s*','',s)
              s=s.replace('</body>',f'<script src="./{name}?v={ver}" defer></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          touch .nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
