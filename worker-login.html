<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gig India - Worker Login</title><style>body{font-family:Arial;margin:0;background:#f5f7fb}.box{max-width:420px;margin:70px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0001}input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box}button{border:0;border-radius:8px;background:#111827;color:#fff;cursor:pointer}.msg{padding:10px;background:#eef2ff;border-radius:8px}.links{display:flex;gap:10px}.links a{flex:1;text-align:center;padding:10px}</style></head><body><div class="box"><h1>Worker Login</h1><p>Gig India Worker Portal</p><input id="u" placeholder="User ID / Mobile / Email"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="m" class="msg">Enter your details.</div><div class="links"><a href="worker-register.html">Create Worker Account</a><a href="admin-login.html">Admin Login</a></div></div><script>function login(){let u=document.getElementById('u').value.trim(),p=document.getElementById('p').value,ws=[];try{ws=JSON.parse(localStorage.getItem('gigIndia_workers')||'[]')}catch(e){}let w=ws.find(x=>String(x.mobile||x.email||x.userId||x.id)===u&&String(x.password||x.pass||'')===p);if(!w){document.getElementById('m').textContent='Worker account not found or password is incorrect.';return}sessionStorage.setItem('gi_role','worker');sessionStorage.setItem('gi_worker_id',String(w.id||w.userId||w.mobile));location.href='index.html?portal=worker'}</script></body></html>
