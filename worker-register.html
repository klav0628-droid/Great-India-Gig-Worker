<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gig India - Worker Register</title><style>body{font-family:Arial;margin:0;background:#f5f7fb}.box{max-width:480px;margin:40px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0001}input,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box}button{border:0;border-radius:8px;background:#111827;color:#fff;cursor:pointer}.msg{padding:10px;background:#eef2ff;border-radius:8px}</style></head><body><div class="box"><h1>Create Worker Account</h1><input id="n" placeholder="Full Name"><input id="m" placeholder="Mobile Number"><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password"><button onclick="reg()">Create Account</button><div id="msg" class="msg">Your account will be saved in this browser.</div><p><a href="worker-login.html">Worker Login</a> · <a href="admin-login.html">Admin Login</a></p></div><script>function reg(){let n=document.getElementById('n').value.trim(),m=document.getElementById('m').value.trim(),e=document.getElementById('e').value.trim(),p=document.getElementById('p').value;if(!n||!m||!p){document.getElementById('msg').textContent='Name, mobile and password are required.';return}let ws=[];try{ws=JSON.parse(localStorage.getItem('gigIndia_workers')||'[]')}catch(x){}if(ws.some(x=>String(x.mobile)===m)){document.getElementById('msg').textContent='This mobile number is already registered.';return}let w={id:'W'+Date.now(),name:n,mobile:m,email:e,password:p,status:'pending',createdAt:new Date().toISOString()};ws.push(w);localStorage.setItem('gigIndia_workers',JSON.stringify(ws));sessionStorage.setItem('gi_role','worker');sessionStorage.setItem('gi_worker_id',w.id);document.getElementById('msg').textContent='Account created successfully. Opening Worker Portal...';setTimeout(()=>location.href='index.html?portal=worker',400)}</script></body></html>
